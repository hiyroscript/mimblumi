<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Infinite 3D World</title>
<style>
/* Layout: one full-bleed canvas. No chrome, no controls; the world is the interface. */
:root {
  --haze: #cdd2bd;
  --ink: #2c3327;
  --note-bg: #e4e6d6;
  --font-text: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--haze);
  color: var(--ink);
  font-family: var(--font-text);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#fail {
  position: fixed; inset: 0; margin: 0;
  display: grid; place-items: center; text-align: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--note-bg); font-size: 1rem; line-height: 1.5;
}
</style>

<div id="stage"></div>
<p id="fail" hidden>This world needs WebGL to draw. Open it in a current browser with hardware acceleration turned on.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const stage = document.getElementById('stage');
const failNote = document.getElementById('fail');
if (!window.THREE) { failNote.hidden = false; return; }
const T = THREE;

/* ============================================================
   1. CONFIG + MATH
   ============================================================ */
const CFG = {
  seed: 20261111,
  chunk: 32,          // world units per chunk side (1 unit = 1 terrain tile)
  loadR: 2,           // chunks generated around the player (and around where they are heading)
  keepR: 3,           // chunks further than this are disposed
  walk: 2.8, run: 6.8,
  zoom: 21, zoomMin: 12, zoomMax: 34,
  yaw: 0.62
};
const CH = CFG.chunk;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, r, dt) => a + (b - a) * (1 - Math.exp(-r * dt));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashInt(x, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ Math.imul(CFG.seed, 1442695041);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return (h ^ h >>> 16) >>> 0;
}
const hash01 = (x, z) => hashInt(x, z) / 4294967296;

/* Seeded 2D simplex noise, output roughly in [-1, 1]. */
function makeNoise(seed) {
  const rng = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  return function (x, y) {
    const s = (x + y) * F2;
    const i = Math.floor(x + s), j = Math.floor(y + s);
    const t = (i + j) * G2;
    const x0 = x - (i - t), y0 = y - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
    const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, a = 0.5 - x0 * x0 - y0 * y0, g;
    if (a > 0) { a *= a; g = perm[ii + perm[jj]] & 7; n += a * a * (GX[g] * x0 + GY[g] * y0); }
    a = 0.5 - x1 * x1 - y1 * y1;
    if (a > 0) { a *= a; g = perm[ii + i1 + perm[jj + j1]] & 7; n += a * a * (GX[g] * x1 + GY[g] * y1); }
    a = 0.5 - x2 * x2 - y2 * y2;
    if (a > 0) { a *= a; g = perm[ii + 1 + perm[jj + 1]] & 7; n += a * a * (GX[g] * x2 + GY[g] * y2); }
    return 70 * n;
  };
}

/* Colours are authored in sRGB and stored linear, because r128 lights in linear space. */
const rgb = hex => { const c = new T.Color(hex).convertSRGBToLinear(); return [c.r, c.g, c.b]; };
const mul = (c, f) => [c[0] * f, c[1] * f, c[2] * f];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/* ============================================================
   2. WORLD FIELDS  (everything is sampled in world space, so chunks always agree)
   ============================================================ */
const N2 = makeNoise(CFG.seed);
const PAL = {
  forest: rgb(0x4a7438), olive: rgb(0x7c8a48), sage: rgb(0x8ea77a), floor: rgb(0x566a38),
  earth: rgb(0x7d5f42), sand: rgb(0xb8a47c), wallEarth: rgb(0x6f563d)
};
const Fields = {
  height(x, z) {
    let h = N2(x / 120, z / 120) * 4.4            // broad rolling hills
          + N2(x / 47 + 31.7, z / 47 - 17.3) * 1.7 // knolls and dips
          + N2(x / 18 - 50.1, z / 18 + 80.4) * 0.5 // uneven ground
          + N2(x / 6.7 + 9.2, z / 6.7 + 300.5) * 0.13;
    h += sm(0.22, 0.5, N2(x / 78 + 200.3, z / 78 + 211.9)) * 1.6; // occasional raised shelves
    return h;
  },
  cell(ix, iz) { return Math.round(Fields.height(ix + 0.5, iz + 0.5) * 4) / 4; },
  ground(x, z) {
    const fx = x - 0.5, fz = z - 0.5, i = Math.floor(fx), j = Math.floor(fz);
    const tx = sm(0.28, 0.72, fx - i), tz = sm(0.28, 0.72, fz - j);
    const a = Fields.cell(i, j), b = Fields.cell(i + 1, j), c = Fields.cell(i, j + 1), d = Fields.cell(i + 1, j + 1);
    return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
  },
  forest: (x, z) => N2(x / 88 + 500.5, z / 88 + 3.1) * 0.72 + N2(x / 29 + 7.7, z / 29 + 500.2) * 0.28,
  glade: (x, z) => N2(x / 15 + 820.1, z / 15 - 410.6),
  moist: (x, z) => N2(x / 150 + 900.9, z / 150 - 900.4),
  dirt: (x, z) => N2(x / 40 - 300.2, z / 40 + 120.8) * 0.8 + N2(x / 9.5 + 60.3, z / 9.5 - 44.4) * 0.3,
  grass: (x, z) => N2(x / 24 + 77.7, z / 24 - 33.3) * 0.65 + N2(x / 7.3 - 12.1, z / 7.3 + 8.8) * 0.35,
  patch: (x, z) => N2(x / 27 + 410.4, z / 27 - 95.6),
  flower: (x, z) => N2(x / 52 - 600.6, z / 52 + 640.2),
  rock: (x, z) => N2(x / 62 + 333.3, z / 62 - 222.2),
  blossom: (x, z) => N2(x / 58 + 1234.5, z / 58 + 77.1),
  /* out = [r, g, b, bareGround 0..1, grassDensity -1..1] for one terrain tile */
  cellColor(wx, wz, o) {
    const x = wx + 0.5, z = wz + 0.5, P = PAL;
    const t = sm(-0.55, 0.55, Fields.moist(x, z));
    let r = lerp(P.olive[0], P.forest[0], t), g = lerp(P.olive[1], P.forest[1], t), b = lerp(P.olive[2], P.forest[2], t);
    const s = sm(0.15, 0.75, Fields.patch(x, z)) * 0.55;
    r = lerp(r, P.sage[0], s); g = lerp(g, P.sage[1], s); b = lerp(b, P.sage[2], s);
    const f = sm(0.15, 0.6, Fields.forest(x, z)) * 0.45;
    r = lerp(r, P.floor[0], f); g = lerp(g, P.floor[1], f); b = lerp(b, P.floor[2], f);
    const d = sm(0.42, 0.66, Fields.dirt(x, z));
    if (d > 0) {
      const k = hash01(wx * 3 + 11, wz * 5 - 7) * 0.6;
      r = lerp(r, lerp(P.sand[0], P.earth[0], k), d);
      g = lerp(g, lerp(P.sand[1], P.earth[1], k), d);
      b = lerp(b, lerp(P.sand[2], P.earth[2], k), d);
    }
    const j = 0.93 + 0.14 * hash01(wx, wz) + (((wx + wz) & 1) ? 0.012 : -0.012);
    o[0] = r * j; o[1] = g * j; o[2] = b * j; o[3] = d; o[4] = Fields.grass(x, z);
  }
};

/* ============================================================
   3. GEOMETRY BUILDER  (chunky boxes with tapered, nudged corners; flat quads for leaves)
   ============================================================ */
const FACES = [[1, 3, 7, 5], [0, 4, 6, 2], [2, 6, 7, 3], [0, 1, 5, 4], [4, 5, 7, 6], [0, 2, 3, 1]];
const _v = new T.Vector3(), _e = new T.Euler(), _q = new T.Quaternion();
const _qa = new T.Quaternion(), _qb = new T.Quaternion();
const AXY = new T.Vector3(0, 1, 0), AXZ = new T.Vector3(0, 0, 1);
const _cs = new Float32Array(24);

class GeoB {
  constructor(rng) { this.rng = rng; this.p = []; this.n = []; this.c = []; this.i = []; this.v = 0; }
  _quad() { const v = this.v; this.i.push(v, v + 1, v + 2, v, v + 2, v + 3); this.v += 4; }
  /* o: x,y,z centre; w,h,d size; c colour; c2 top colour; taper; rx,ry,rz or q; jit; shade; fj; noBottom; noTop */
  box(o) {
    const rng = this.rng, hw = o.w / 2, hh = o.h / 2, hd = o.d / 2;
    const tp = o.taper == null ? 1 : o.taper, jit = o.jit || 0;
    const q = o.q || ((o.rx || o.ry || o.rz) ? _q.setFromEuler(_e.set(o.rx || 0, o.ry || 0, o.rz || 0)) : null);
    for (let k = 0; k < 8; k++) {
      const top = k & 2;
      let x = (k & 1 ? hw : -hw) * (top ? tp : 1), y = top ? hh : -hh, z = (k & 4 ? hd : -hd) * (top ? tp : 1);
      if (jit) { x += (rng() - 0.5) * jit * o.w; y += (rng() - 0.5) * jit * o.h; z += (rng() - 0.5) * jit * o.d; }
      if (q) { _v.set(x, y, z).applyQuaternion(q); x = _v.x; y = _v.y; z = _v.z; }
      _cs[k * 3] = x + o.x; _cs[k * 3 + 1] = y + o.y; _cs[k * 3 + 2] = z + o.z;
    }
    const cb = o.c, ct = o.c2 || o.c, sh = o.shade == null ? 0.8 : o.shade, fj = o.fj == null ? 0.07 : o.fj;
    for (let f = 0; f < 6; f++) {
      if ((f === 3 && o.noBottom) || (f === 2 && o.noTop)) continue;
      const F = FACES[f], a = F[0] * 3, b = F[1] * 3, c = F[2] * 3;
      const ux = _cs[b] - _cs[a], uy = _cs[b + 1] - _cs[a + 1], uz = _cs[b + 2] - _cs[a + 2];
      const vx = _cs[c] - _cs[a], vy = _cs[c + 1] - _cs[a + 1], vz = _cs[c + 2] - _cs[a + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
      const fm = 1 + (rng() - 0.5) * fj;
      for (let m = 0; m < 4; m++) {
        const k = F[m], top = k & 2, col = top ? ct : cb, mu = (top ? 1 : sh) * fm;
        this.p.push(_cs[k * 3], _cs[k * 3 + 1], _cs[k * 3 + 2]);
        this.n.push(nx, ny, nz);
        this.c.push(col[0] * mu, col[1] * mu, col[2] * mu);
      }
      this._quad();
    }
  }
  /* A box grown from a base point along a tilted direction. Returns the far end. */
  limb(bx, by, bz, az, tilt, len, w, c, extra) {
    _qa.setFromAxisAngle(AXY, az).multiply(_qb.setFromAxisAngle(AXZ, -tilt));
    const dx = Math.sin(tilt) * Math.cos(az), dy = Math.cos(tilt), dz = -Math.sin(tilt) * Math.sin(az);
    this.box(Object.assign({ x: bx + dx * len / 2, y: by + dy * len / 2, z: bz + dz * len / 2, w: w, h: len, d: w, c: c, q: _qa }, extra || {}));
    return [bx + dx * len, by + dy * len, bz + dz * len];
  }
  /* Flat quad lit as if it faced the sky, so leaves and petals shade like the ground they sit on. */
  quad(pts, c0, c1, c2, c3) {
    const cs = [c0, c1, c2, c3];
    for (let m = 0; m < 4; m++) {
      this.p.push(pts[m * 3], pts[m * 3 + 1], pts[m * 3 + 2]);
      this.n.push(0, 1, 0);
      this.c.push(cs[m][0], cs[m][1], cs[m][2]);
    }
    this._quad();
  }
  petal(cx, cy, cz, a, r0, len, wi, wo, lift, c, ct) {
    const dx = Math.cos(a), dz = Math.sin(a), px = -dz, pz = dx;
    const ix = cx + dx * r0, iz = cz + dz * r0, ox = cx + dx * (r0 + len), oz = cz + dz * (r0 + len);
    this.quad([ix + px * wi, cy, iz + pz * wi, ix - px * wi, cy, iz - pz * wi,
               ox - px * wo, cy + lift, oz - pz * wo, ox + px * wo, cy + lift, oz + pz * wo], c, c, ct, ct);
  }
  blade(bx, bz, a, h, w, lean) {
    const dx = Math.cos(a), dz = Math.sin(a), px = -dz * w / 2, pz = dx * w / 2;
    const mx = bx + dx * lean * 0.35, mz = bz + dz * lean * 0.35, my = h * 0.55;
    const v = this.v;
    this.p.push(bx - px, 0, bz - pz, bx + px, 0, bz + pz,
                mx - px * 0.75, my, mz - pz * 0.75, mx + px * 0.75, my, mz + pz * 0.75,
                bx + dx * lean, h, bz + dz * lean);
    for (let m = 0; m < 5; m++) this.n.push(0, 1, 0);
    this.c.push(0.56, 0.6, 0.52, 0.56, 0.6, 0.52, 0.9, 0.93, 0.84, 0.9, 0.93, 0.84, 1.2, 1.2, 0.98);
    this.i.push(v, v + 1, v + 3, v, v + 3, v + 2, v + 2, v + 3, v + 4);
    this.v += 5;
  }
  build() {
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new T.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new T.Float32BufferAttribute(this.c, 3));
    g.setIndex(this.i);
    g.computeBoundingSphere();
    return g;
  }
}

/* ============================================================
   4. ASSETS — trees, rocks, flowers, grass
   ============================================================ */
const LEAF = {
  oak: [rgb(0x4f7d3a), rgb(0x5f8f43), rgb(0x3f6a34), rgb(0x6f9a4c)],
  pine: [rgb(0x28503a), rgb(0x2f5d3e), rgb(0x3d6d47)],
  blossom: [rgb(0xe2b3ba), rgb(0xd79aa8), rgb(0xeecfd2), rgb(0xcf8f9e)],
  birch: [rgb(0x93a654), rgb(0xa7b565), rgb(0x7f9a4e), rgb(0xb7bd68)],
  bush: [rgb(0x5a8444), rgb(0x4a7240), rgb(0x6c9150)]
};
const BARK = { oak: rgb(0x6a4a30), dark: rgb(0x4f3826), pine: rgb(0x5a4030), birch: rgb(0xd9d3c2), mark: rgb(0x3c352c) };
const pick = (arr, rng) => arr[(rng() * arr.length) | 0];

function leafBlob(g, x, y, z, s, pal, rng, flat) {
  const c = mul(pick(pal, rng), 0.94 + rng() * 0.12);
  g.box({ x: x, y: y, z: z, w: s * (0.9 + rng() * 0.25), h: s * (flat || (0.74 + rng() * 0.26)), d: s * (0.9 + rng() * 0.25),
          c: c, c2: mul(c, 1.16), shade: 0.66, jit: 0.07, taper: 0.9 + rng() * 0.1,
          ry: rng() * 1.2, rx: (rng() - 0.5) * 0.22, rz: (rng() - 0.5) * 0.22 });
}

function makeOak(rng) {
  const g = new GeoB(rng), th = 1.7 + rng() * 0.9, tw = 0.42 + rng() * 0.14;
  g.box({ x: 0, y: 0.13, z: 0, w: tw * 1.75, h: 0.3, d: tw * 1.75, taper: 0.6, c: mul(BARK.oak, 0.85), shade: 0.7, ry: rng() * 1.5, noBottom: true });
  g.box({ x: 0, y: th / 2, z: 0, w: tw, h: th, d: tw, taper: 0.8, c: BARK.oak, shade: 0.72, ry: rng() * 0.6, noBottom: true });
  const top = th + 1.0, nb = 2 + ((rng() * 2) | 0);
  for (let b = 0; b < nb; b++) {
    const end = g.limb(0, th * (0.7 + rng() * 0.2), 0, rng() * TAU, 0.6 + rng() * 0.45, 0.9 + rng() * 0.6, tw * 0.5, mul(BARK.oak, 0.92), { shade: 0.8 });
    leafBlob(g, end[0], end[1] + 0.25, end[2], 1.0 + rng() * 0.5, LEAF.oak, rng);
  }
  const n = 6 + ((rng() * 4) | 0);
  for (let k = 0; k < n; k++) {
    const a = rng() * TAU, rad = Math.pow(rng(), 0.7) * 1.45;
    leafBlob(g, Math.cos(a) * rad, top + (rng() - 0.4) * 1.3, Math.sin(a) * rad, 1.85 - rad * 0.5 + rng() * 0.4, LEAF.oak, rng);
  }
  return g.build();
}

function makePine(rng) {
  const g = new GeoB(rng), n = 4 + ((rng() * 2) | 0), w0 = 2.4 + rng() * 0.6;
  g.box({ x: 0, y: 0.7, z: 0, w: 0.36, h: 1.4, d: 0.36, taper: 0.8, c: BARK.pine, shade: 0.7, ry: rng(), noBottom: true });
  let y = 1.0;
  for (let k = 0; k < n; k++) {
    const f = k / n, w = w0 * (1 - f * 0.76), h = 0.9 + rng() * 0.2;
    const c = mul(mixc(LEAF.pine[0], LEAF.pine[2], f), 0.95 + rng() * 0.1);
    g.box({ x: (rng() - 0.5) * 0.12, y: y + h / 2, z: (rng() - 0.5) * 0.12, w: w, h: h, d: w, taper: 0.44,
            c: mul(c, 0.82), c2: mul(c, 1.18), shade: 0.8, jit: 0.04, ry: k * 0.42 + rng() * 0.3 });
    y += h * 0.7;
  }
  g.box({ x: 0, y: y + 0.32, z: 0, w: 0.3, h: 0.7, d: 0.3, taper: 0.25, c: mul(LEAF.pine[2], 1.1), shade: 0.8, ry: rng() });
  return g.build();
}

function makeBlossom(rng) {
  const g = new GeoB(rng), a0 = rng() * TAU;
  g.box({ x: 0, y: 0.1, z: 0, w: 0.62, h: 0.24, d: 0.62, taper: 0.6, c: mul(BARK.dark, 0.9), shade: 0.7, ry: rng(), noBottom: true });
  const e1 = g.limb(0, 0, 0, a0, 0.2 + rng() * 0.12, 1.3 + rng() * 0.3, 0.34, BARK.dark, { shade: 0.75, taper: 0.82 });
  const e2 = g.limb(e1[0], e1[1] - 0.05, e1[2], a0 + 2.2 + rng(), 0.4 + rng() * 0.2, 0.95 + rng() * 0.3, 0.25, BARK.dark, { shade: 0.85 });
  const ends = [e2], nb = 2 + ((rng() * 2) | 0);
  for (let b = 0; b < nb; b++)
    ends.push(g.limb(e1[0], e1[1] - 0.1, e1[2], a0 + b * (TAU / nb) + rng() * 0.8, 0.85 + rng() * 0.3, 0.9 + rng() * 0.5, 0.17, mul(BARK.dark, 0.95), { shade: 0.85 }));
  for (const e of ends) {
    const m = 2 + ((rng() * 2) | 0);
    for (let k = 0; k < m; k++)
      leafBlob(g, e[0] + (rng() - 0.5) * 1.0, e[1] + 0.2 + rng() * 0.5, e[2] + (rng() - 0.5) * 1.0, 0.95 + rng() * 0.6, LEAF.blossom, rng, 0.62 + rng() * 0.2);
  }
  return g.build();
}

function makeBirch(rng) {
  const g = new GeoB(rng), th = 3.4 + rng() * 1.0;
  g.box({ x: 0, y: th / 2, z: 0, w: 0.25, h: th, d: 0.25, taper: 0.7, c: BARK.birch, shade: 0.8, ry: rng(), noBottom: true });
  for (let k = 0; k < 5; k++) {
    const y = 0.3 + rng() * (th * 0.55);
    g.box({ x: (rng() - 0.5) * 0.06, y: y, z: (rng() - 0.5) * 0.06, w: 0.265, h: 0.05 + rng() * 0.05, d: 0.265, c: BARK.mark, shade: 1, fj: 0, ry: rng() * 0.3, noBottom: true, noTop: true });
  }
  for (let b = 0; b < 2; b++) {
    const e = g.limb(0, th * (0.55 + rng() * 0.25), 0, rng() * TAU, 0.7 + rng() * 0.3, 0.7 + rng() * 0.4, 0.1, BARK.birch, { shade: 0.9 });
    leafBlob(g, e[0], e[1] + 0.15, e[2], 0.7 + rng() * 0.3, LEAF.birch, rng);
  }
  const n = 6 + ((rng() * 3) | 0);
  for (let k = 0; k < n; k++) {
    const a = rng() * TAU, rad = 0.25 + rng() * 0.7;
    leafBlob(g, Math.cos(a) * rad, th * (0.55 + (k / n) * 0.55) + rng() * 0.3, Math.sin(a) * rad, 0.75 + rng() * 0.45, LEAF.birch, rng);

}

function makeBush(rng) {
  const g = new GeoB(rng), n = 3 + ((rng() * 4) | 0);
  for (let k = 0; k < n; k++) {
    const a = rng() * TAU, rad = k ? 0.25 + rng() * 0.4 : 0, s = 0.5 + rng() * 0.45;
    leafBlob(g, Math.cos(a) * rad, s * 0.38, Math.sin(a) * rad, s, LEAF.bush, rng);

}

const STONE = [rgb(0x8d8b84), rgb(0x77756f), rgb(0x9a968c), rgb(0x8a7b68), rgb(0x75685a)];
const MOSS = rgb(0x66803f);
function makeRock(rng, kind) {
  const g = new GeoB(rng), base = pick(STONE, rng);
  const w = kind === 'tall' ? 0.72 : kind === 'flat' ? 1.3 : 1.0;
  const h = kind === 'tall' ? 1.25 + rng() * 0.3 : kind === 'flat' ? 0.34 + rng() * 0.1 : 0.62 + rng() * 0.28;
  const d = w * (0.72 + rng() * 0.3);
  g.box({ x: 0, y: h / 2 - 0.1, z: 0, w: w, h: h, d: d, taper: 0.62 + rng() * 0.2, jit: 0.22, c: base, c2: mul(base, 1.12),
          shade: 0.64, fj: 0.14, ry: rng() * TAU, rx: (rng() - 0.5) * 0.3, rz: (rng() - 0.5) * 0.3 });
  if (rng() < 0.45) g.box({ x: (rng() - 0.5) * 0.15, y: h - 0.12, z: (rng() - 0.5) * 0.15, w: w * 0.55, h: 0.09, d: d * 0.55, c: MOSS, c2: mul(MOSS, 1.15), jit: 0.2, ry: rng(), shade: 0.9, noBottom: true });
  const n = 1 + ((rng() * 3) | 0);
  for (let k = 0; k < n; k++) {
    const a = rng() * TAU, rad = w * (0.42 + rng() * 0.3), s = 0.32 + rng() * 0.36, c = mul(pick(STONE, rng), 0.95 + rng() * 0.1);
    g.box({ x: Math.cos(a) * rad, y: s * 0.3 - 0.06, z: Math.sin(a) * rad, w: s, h: s * (0.6 + rng() * 0.4), d: s * (0.7 + rng() * 0.4),
            taper: 0.65 + rng() * 0.2, jit: 0.24, c: c, c2: mul(c, 1.1), shade: 0.64, fj: 0.14, ry: rng() * TAU, rx: (rng() - 0.5) * 0.4 });
  }
  return g.build();
}

const STEM = rgb(0x5c7a3c), LEAFG = rgb(0x6b8f45), POLLEN = rgb(0xe3c24e);
const FLOWERS = [
  { h: 0.42, petals: 9, len: 0.1, wi: 0.018, wo: 0.034, lift: 0.015, c: rgb(0xf2efe6), ct: rgb(0xffffff), core: POLLEN },                 // daisy
  { h: 0.3, petals: 5, len: 0.075, wi: 0.03, wo: 0.055, lift: 0.045, c: rgb(0xd9b848), ct: rgb(0xecd272), core: rgb(0xc99a2e) },         // buttercup
  { h: 0.5, petals: 7, len: 0.12, wi: 0.022, wo: 0.046, lift: 0.02, c: rgb(0xcf8fa8), ct: rgb(0xe6bccb), core: POLLEN },                 // cosmos
  { h: 0.62, spike: true, c: rgb(0x8f7ab8), ct: rgb(0xb09ad0) },                                                                         // lupine
  { h: 0.22, petals: 5, len: 0.05, wi: 0.02, wo: 0.034, lift: 0.01, c: rgb(0x9fb6d6), ct: rgb(0xc3d3e8), core: POLLEN, stems: 3 },       // forget-me-not
  { h: 0.45, petals: 4, len: 0.1, wi: 0.04, wo: 0.075, lift: 0.05, c: rgb(0xcf7a62), ct: rgb(0xe09c84), core: rgb(0x3a2f2a) }            // poppy
];
function makeFlower(rng, sp) {
  const g = new GeoB(rng), n = sp.stems || 2;
  for (let s = 0; s < n; s++) {
    const a = rng() * TAU, off = s ? 0.1 + rng() * 0.12 : 0, bx = Math.cos(a) * off, bz = Math.sin(a) * off;
    const H = sp.h * (0.72 + rng() * 0.42);
    const e = g.limb(bx, 0, bz, rng() * TAU, 0.06 + rng() * 0.14, H, 0.032, STEM, { shade: 0.65, noBottom: true, noTop: true, fj: 0 });
    for (let l = 0; l < 2; l++)
      g.petal(lerp(bx, e[0], 0.25), H * (0.18 + rng() * 0.2), lerp(bz, e[2], 0.25), rng() * TAU, 0.01, 0.11 + rng() * 0.05, 0.012, 0.04, 0.06, mul(LEAFG, 0.8), LEAFG);
    if (sp.spike) {
      for (let k = 0; k < 6; k++) {
        const f = k / 5, t = 0.5 + f * 0.56, w = lerp(0.115, 0.04, f);
        g.box({ x: lerp(bx, e[0], t), y: H * t, z: lerp(bz, e[2], t), w: w, h: H * 0.1, d: w, c: mixc(sp.c, sp.ct, f * 0.7 + rng() * 0.3), shade: 0.8, ry: rng() * 1.5, taper: 0.8, noBottom: true });

      g.box({ x: e[0], y: e[1] + 0.02, z: e[2], w: 0.05, h: 0.04, d: 0.05, c: sp.core, shade: 0.85, fj: 0, ry: rot, noBottom: true });

}

function makeGrass(rng, kind) {
  const g = new GeoB(rng);
  const n = kind === 'tall' ? 8 : 6;
  for (let k = 0; k < n; k++) {
    const a = rng() * TAU, r = rng() * (kind === 'leafy' ? 0.05 : 0.17);
    const h = kind === 'tall' ? 0.55 + rng() * 0.42 : kind === 'leafy' ? 0.16 + rng() * 0.12 : 0.2 + rng() * 0.2;
    const w = kind === 'leafy' ? 0.13 + rng() * 0.04 : 0.055 + rng() * 0.03;
    const lean = kind === 'tall' ? 0.2 + rng() * 0.22 : kind === 'leafy' ? 0.2 + rng() * 0.1 : 0.08 + rng() * 0.1;
    const dir = kind === 'leafy' ? k * TAU / n + rng() * 0.5 : rng() * TAU;
    g.blade(Math.cos(a) * r, Math.sin(a) * r, dir, h, w, lean);
  }
  return g.build();
}

/* ============================================================
   5. RENDERER, SCENE, LIGHT
   ============================================================ */
let renderer;
try {
  renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) { failNote.hidden = false; return; }
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => e.preventDefault());

const scene = new T.Scene();
const HAZE = 0xcdd2bd;
scene.background = new T.Color(HAZE);
scene.fog = new T.Fog(new T.Color(HAZE).convertSRGBToLinear(), 20, 100);

const camera = new T.PerspectiveCamera(34, 1, 0.5, 400);

/* Camera basis on the ground plane (the camera never rotates, so these are constant). */
const FWD = new T.Vector3(-Math.sin(CFG.yaw), 0, -Math.cos(CFG.yaw));
const RIGHT = new T.Vector3(Math.cos(CFG.yaw), 0, -Math.sin(CFG.yaw));
const SUN = new T.Vector3().addScaledVector(RIGHT, -0.72).addScaledVector(FWD, 0.25).add(new T.Vector3(0, 0.95, 0)).normalize();
const SUNH = (() => { const l = Math.hypot(SUN.x, SUN.z); return { x: SUN.x / l, z: SUN.z / l }; })();

const hemi = new T.HemisphereLight(new T.Color(0xe3e8ee).convertSRGBToLinear(), new T.Color(0x77724f).convertSRGBToLinear(), 0.56);
scene.add(hemi);
const sun = new T.DirectionalLight(new T.Color(0xffe3b6).convertSRGBToLinear(), 1.0);
sun.castShadow = true;
const SHADOW_RES = COARSE ? 1536 : 2048;
sun.shadow.mapSize.set(SHADOW_RES, SHADOW_RES);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.035;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 260;
scene.add(sun); scene.add(sun.target);
const bounce = new T.DirectionalLight(new T.Color(0xb9c9d6).convertSRGBToLinear(), 0.14); // cool fill from the far side
bounce.position.set(-SUN.x, 0.6, -SUN.z);
scene.add(bounce);

/* Light-space axes, used to move the shadow frustum in whole texels (no shimmer while walking). */
const L_X = new T.Vector3().crossVectors(AXY, SUN).normalize();
const L_Y = new T.Vector3().crossVectors(SUN, L_X).normalize();
let shadowExt = 0;

/* ---------- Materials ---------- */
const U = { uTime: { value: 0 }, uWind: { value: REDUCED ? 0.025 : 0.095 }, uObs: { value: new T.Vector4(0, 0, 1, 1) } };

const matTerrain = new T.MeshLambertMaterial({ vertexColors: true });
const matRock = new T.MeshLambertMaterial({ vertexColors: true });
const matPlayer = new T.MeshLambertMaterial({ vertexColors: true });

/* Trees: anything standing between the camera and the player dissolves into a soft dithered window. */
const matTree = new T.MeshLambertMaterial({ vertexColors: true });
matTree.onBeforeCompile = function (sh) {
  sh.uniforms.uObs = U.uObs;
  sh.vertexShader = sh.vertexShader
    .replace(/void\s+main\s*\(\s*\)\s*\{/, 'varying float vObsDepth;\nvoid main() {')
    .replace('#include <project_vertex>', '#include <project_vertex>\n  vObsDepth = -mvPosition.z;');
  sh.fragmentShader = sh.fragmentShader.replace(/void\s+main\s*\(\s*\)\s*\{/,
    'uniform vec4 uObs;\nvarying float vObsDepth;\nvoid main() {\n' +
    '  if (vObsDepth < uObs.z - 0.7) {\n' +
    '    float od = length(gl_FragCoord.xy - uObs.xy) / uObs.w;\n' +
    '    if (od < 1.0) {\n' +
    '      float th = fract(52.9829189 * fract(dot(floor(gl_FragCoord.xy), vec2(0.06711056, 0.00583715))));\n' +
    '      if (th > od * od * 0.92 + 0.06) discard;\n' +
    '    }\n' +
    '  }\n');
};

/* Grass and flowers: sway with one shared wind field, and shade both faces alike. */
const matVeg = new T.MeshLambertMaterial({ vertexColors: true, side: T.DoubleSide });
matVeg.onBeforeCompile = function (sh) {
  sh.uniforms.uTime = U.uTime; sh.uniforms.uWind = U.uWind;
  sh.vertexShader = sh.vertexShader
    .replace(/void\s+main\s*\(\s*\)\s*\{/, 'uniform float uTime;\nuniform float uWind;\nvoid main() {')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\n' +
      '#ifdef USE_INSTANCING\n' +
      '  vec4 wpos = instanceMatrix * vec4(position, 1.0);\n' +
      '  float wy = max(position.y, 0.0);\n' +
      '  float wph = uTime * 1.35 + wpos.x * 0.21 + wpos.z * 0.16;\n' +
      '  float wv = sin(wph) + 0.45 * sin(wph * 2.3 + 1.7);\n' +
      '  float wamt = wy * wy * uWind + wy * uWind * 0.25;\n' +
      '  transformed.x += wv * wamt;\n' +
      '  transformed.z += wv * wamt * 0.55;\n' +
      '#endif\n');
  sh.fragmentShader = sh.fragmentShader.split('gl_FrontFacing').join('true');
};

/* ============================================================
   6. INSTANCE POOLS — one draw call per asset for the whole world
   ============================================================ */
const pools = [];
const KIND = { oak: [], pine: [], blossom: [], birch: [], bush: [], rock: [], flower: [], gShort: -1, gTall: -1, gLeafy: -1 };
function addPool(geo, mat, cap, cast) {
  const m = new T.InstancedMesh(geo, mat, cap);
  m.instanceMatrix.setUsage(T.DynamicDrawUsage);
  m.instanceColor = new T.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
  m.instanceColor.setUsage(T.DynamicDrawUsage);
  m.count = 0; m.frustumCulled = false; m.castShadow = cast; m.receiveShadow = true;
  m.matrixAutoUpdate = false; m.userData.cap = cap;
  scene.add(m); pools.push(m);
  return pools.length - 1;
}
(function buildPools() {
  const rng = mulberry32(CFG.seed ^ 0x51ed270b);
  for (let i = 0; i < 3; i++) KIND.oak.push(addPool(makeOak(rng), matTree, 420, true));
  for (let i = 0; i < 3; i++) KIND.pine.push(addPool(makePine(rng), matTree, 420, true));
  for (let i = 0; i < 2; i++) KIND.blossom.push(addPool(makeBlossom(rng), matTree, 320, true));
  for (let i = 0; i < 3; i++) KIND.birch.push(addPool(makeBirch(rng), matTree, 420, true));
  for (let i = 0; i < 2; i++) KIND.bush.push(addPool(makeBush(rng), matTree, 700, true));
  for (const k of ['round', 'round', 'tall', 'flat', 'round']) KIND.rock.push(addPool(makeRock(rng, k), matRock, 700, true));
  for (const sp of FLOWERS) KIND.flower.push(addPool(makeFlower(rng, sp), matVeg, 1800, false));
  KIND.gShort = addPool(makeGrass(rng, 'short'), matVeg, 16000, false);
  KIND.gTall = addPool(makeGrass(rng, 'tall'), matVeg, 9000, false);
  KIND.gLeafy = addPool(makeGrass(rng, 'leafy'), matVeg, 4500, false);
})();

/* ============================================================
   7. CHUNK GENERATION — terrain mesh + object placement, a pure function of (cx, cz, seed)
   ============================================================ */
const MAXV = CH * CH * 12;
const S = { pos: new Float32Array(MAXV * 3), nor: new Float32Array(MAXV * 3), col: new Float32Array(MAXV * 3), idx: new Uint16Array(MAXV / 4 * 6) };
const _cc = [0, 0, 0, 0, 0];

function makeChunk(cx, cz) {
  const N = CH, ox = cx * N, oz = cz * N, W = N + 2, CW = N + 1;
  const rng = mulberry32(hashInt(cx * 7 + 1, cz * 13 - 5));

  /* Tile heights, with a one-tile border so edges match the neighbours exactly. */
  const H = new Float32Array(W * W);
  for (let j = -1; j <= N; j++) for (let i = -1; i <= N; i++) H[(i + 1) + (j + 1) * W] = Fields.cell(ox + i, oz + j);
  const hL = (i, j) => H[(i + 1) + (j + 1) * W];
  const hW = (wx, wz) => {
    const i = Math.floor(wx) - ox, j = Math.floor(wz) - oz;
    return (i >= -1 && i <= N && j >= -1 && j <= N) ? hL(i, j) : Fields.cell(Math.floor(wx), Math.floor(wz));
  };

  const col = new Float32Array(CW * CW * 3), dirtA = new Float32Array(CW * CW), grassA = new Float32Array(CW * CW);
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    Fields.cellColor(ox + i, oz + j, _cc);
    const k = i + j * CW;
    col[k * 3] = _cc[0]; col[k * 3 + 1] = _cc[1]; col[k * 3 + 2] = _cc[2]; dirtA[k] = _cc[3]; grassA[k] = _cc[4];
  }

  /* ---- object placement ---- */
  const inst = new Array(pools.length).fill(null);
  const put = (k, x, y, z, ry, sx, sy, sz, r, g, b) => {
    const d = inst[k] || (inst[k] = { m: [], c: [] });
    const c = Math.cos(ry), s = Math.sin(ry);
    d.m.push(c * sx, 0, -s * sx, 0, 0, sy, 0, 0, s * sz, 0, c * sz, 0, x, y, z, 1);
    d.c.push(r, g, b);
  };
  const colliders = [];              // flat [x, z, r, ...] in world space
  const solids = [];                 // [x, z, r] keeps things from growing inside each other
  const shade = new Float32Array(N * N).fill(1);   // soft contact shadow baked into the ground
  const stamp = (wx, wz, rad, str) => {
    const lx = wx - ox, lz = wz - oz;
    const i0 = Math.max(0, Math.floor(lx - rad)), i1 = Math.min(N - 1, Math.floor(lx + rad));
    const j0 = Math.max(0, Math.floor(lz - rad)), j1 = Math.min(N - 1, Math.floor(lz + rad));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const d = Math.hypot(i + 0.5 - lx, j + 0.5 - lz);
      if (d < rad) { const v = 1 - str * (1 - d / rad); if (v < shade[i + j * N]) shade[i + j * N] = v; }
    }
  };
  const blocked = (x, z, pad) => {
    for (let k = 0; k < solids.length; k++) { const s = solids[k]; if (Math.hypot(x - s[0], z - s[1]) < s[2] + pad) return true; }
    return false;
  };

  /* Trees: a jittered lattice thinned by the forest field, so groves, loners and clearings all appear. */
  for (let gj = 0; gj < 8; gj++) for (let gi = 0; gi < 8; gi++) {
    const r1 = rng(), r2 = rng(), r3 = rng(), r4 = rng(), r5 = rng();
    const x = ox + (gi + 0.14 + 0.72 * r1) * 4, z = oz + (gj + 0.14 + 0.72 * r2) * 4;
    if (x * x + z * z < 49) continue;                       // keep the spawn glade open
    const F = Fields.forest(x, z);
    let p = 0.03 + 0.78 * sm(0.0, 0.55, F);
    if (Fields.glade(x, z) > 0.4) p *= 0.12;
    const li = Math.floor(x) - ox, lj = Math.floor(z) - oz;
    if (dirtA[li + lj * CW] > 0.6) p *= 0.2;
    if (r3 > p) continue;
    const h = hL(li, lj);
    if (Math.max(Math.abs(h - hL(li + 1, lj)), Math.abs(h - hL(li - 1, lj)), Math.abs(h - hL(li, lj + 1)), Math.abs(h - hL(li, lj - 1))) > 0.5) continue;
    if (blocked(x, z, 2.2)) continue;
    const M = Fields.moist(x, z);
    const wOak = 1, wPine = 2.3 * sm(0.0, 0.5, M), wBirch = 1.7 * sm(0.0, 0.5, -M), wBlos = 0.1 + 3.2 * sm(0.42, 0.7, Fields.blossom(x, z));
    let t = r4 * (wOak + wPine + wBirch + wBlos), type;
    if ((t -= wOak) < 0) type = 'oak'; else if ((t -= wPine) < 0) type = 'pine'; else if ((t -= wBirch) < 0) type = 'birch'; else type = 'blossom';
    const s = (0.82 + 0.45 * r5) * (F < 0.05 ? 1.16 : 1);
    put(pick(KIND[type], rng), x, h - 0.05, z, rng() * TAU, s, s * (0.92 + rng() * 0.2), s, 0.9 + rng() * 0.2, 0.92 + rng() * 0.16, 0.88 + rng() * 0.2);
    colliders.push(x, z, 0.3 * s);
    solids.push([x, z, 0.35 * s]);
    stamp(x, z, (type === 'pine' ? 1.9 : type === 'birch' ? 1.6 : 2.5) * s, 0.24);
  }
  /* Bushes gather along forest edges. */
  for (let k = 0; k < 12; k++) {
    const x = ox + 1 + rng() * (N - 2), z = oz + 1 + rng() * (N - 2), r = rng(), sc = 0.8 + rng() * 0.7, ry = rng() * TAU, tn = 0.9 + rng() * 0.2;
    const F = Fields.forest(x, z);
    if (r > 0.06 + 0.5 * sm(-0.15, 0.1, F) * (1 - sm(0.3, 0.6, F))) continue;
    if (x * x + z * z < 16 || blocked(x, z, 1.1)) continue;
    put(pick(KIND.bush, rng), x, hW(x, z) - 0.03, z, ry, sc, sc, sc, tn, tn, tn * 0.96);
    solids.push([x, z, 0.4 * sc]); colliders.push(x, z, 0.38 * sc);
    stamp(x, z, 1.1 * sc, 0.2);
  }

  /* Rocks: outcrops where the rock field is strong, stray pebbles everywhere else. */
  const placeRock = (x, z, sc) => {
    if (x < ox + 0.6 || z < oz + 0.6 || x > ox + N - 0.6 || z > oz + N - 0.6) return;
    if (x * x + z * z < 20 || blocked(x, z, 0.45 * sc + 0.3)) return;
    const e = 0.4 * sc;
    const y = Math.min(hW(x, z), hW(x + e, z), hW(x - e, z), hW(x, z + e), hW(x, z - e));
    const tn = 0.9 + rng() * 0.2;
    put(pick(KIND.rock, rng), x, y - 0.03 * sc, z, rng() * TAU, sc * (0.85 + rng() * 0.3), sc * (0.8 + rng() * 0.45), sc * (0.85 + rng() * 0.3), tn, tn * 0.99, tn * 0.97);
    if (sc >= 0.55) { colliders.push(x, z, 0.52 * sc); solids.push([x, z, 0.6 * sc]); stamp(x, z, 1.0 * sc + 0.5, 0.22); }
  };
  {
    const R = Fields.rock(ox + N / 2, oz + N / 2);
    const clusters = R > 0.3 ? 1 + ((rng() * 2.4) | 0) : (rng() < 0.3 ? 1 : 0);
    for (let c = 0; c < clusters; c++) {
      const x = ox + 3 + rng() * (N - 6), z = oz + 3 + rng() * (N - 6);
      const big = R > 0.45 && rng() < 0.65, sc = big ? 1.5 + rng() * 1.0 : 0.65 + rng() * 0.5;
      placeRock(x, z, sc);
      const n = 2 + ((rng() * 5) | 0);
      for (let k = 0; k < n; k++) {
        const a = rng() * TAU, d = sc * (0.75 + rng() * 1.3);
        placeRock(x + Math.cos(a) * d, z + Math.sin(a) * d, sc * (0.18 + rng() * 0.42));
      }
    }
    const pebbles = 3 + ((rng() * 6) | 0);
    for (let k = 0; k < pebbles; k++) placeRock(ox + rng() * N, oz + rng() * N, 0.14 + rng() * 0.22);
  }

  /* Flowers: drifts of one species, with a few strangers mixed in. */
  {
    const Fl = Fields.flower(ox + N / 2, oz + N / 2);
    const drifts = Fl > 0.15 ? 2 + ((rng() * 4 * sm(0.15, 0.7, Fl)) | 0) : (rng() < 0.35 ? 1 : 0);
    for (let c = 0; c < drifts; c++) {
      const x0 = ox + 2 + rng() * (N - 4), z0 = oz + 2 + rng() * (N - 4);
      const main = (rng() * KIND.flower.length) | 0, rad = 1.2 + rng() * 2.2;
      const n = 5 + ((rng() * (Fl > 0.55 ? 22 : 11)) | 0);
      for (let k = 0; k < n; k++) {
        const a = rng() * TAU, d = rad * rng() * Math.sqrt(rng()), kind = rng() < 0.82 ? main : (rng() * KIND.flower.length) | 0;
        const sc = 1.05 + rng() * 0.6, ry = rng() * TAU, tn = 0.92 + rng() * 0.16;
        const x = x0 + Math.cos(a) * d, z = z0 + Math.sin(a) * d;
        if (x < ox + 0.3 || z < oz + 0.3 || x > ox + N - 0.3 || z > oz + N - 0.3) continue;
        const li = Math.floor(x) - ox, lj = Math.floor(z) - oz;
        if (dirtA[li + lj * CW] > 0.75 || blocked(x, z, 0.15)) continue;
        put(KIND.flower[kind], x, hL(li, lj), z, ry, sc, sc, sc, tn, tn, tn);
      }
    }
  }

  /* Grass: thick where the grass field is high, thin on bare earth and under dense canopy. */
  for (let k = 0; k < 540; k++) {
    const x = ox + rng() * N, z = oz + rng() * N, r = rng(), r2 = rng(), sc = 0.85 + rng() * 0.6, ry = rng() * TAU, tn = 1.2 + rng() * 0.36, warm = rng();
    const li = Math.min(N - 1, Math.floor(x) - ox), lj = Math.min(N - 1, Math.floor(z) - oz), ci = li + lj * CW;
    const G = grassA[ci];
    const p = (0.14 + 0.86 * sm(-0.4, 0.3, G)) * (1 - sm(0.3, 0.6, dirtA[ci])) * (0.55 + 0.45 * shade[li + lj * N]);
    if (r > p || blocked(x, z, 0.05)) continue;
    const kind = (G > 0.3 && r2 < 0.55) ? KIND.gTall : (r2 > 0.9 ? KIND.gLeafy : KIND.gShort);
    put(kind, x, hL(li, lj), z, ry, sc, sc * (0.85 + warm * 0.4), sc,
        col[ci * 3] * tn * (1 + warm * 0.12), col[ci * 3 + 1] * tn, col[ci * 3 + 2] * tn * (1 - warm * 0.15));
  }

  /* ---- terrain mesh: flat tile tops plus the little walls between height steps ---- */
  const P = S.pos, Nn = S.nor, Cc = S.col, I = S.idx;
  let v = 0, ii = 0;
  const pv = (x, y, z, nx, ny, nz, r, g, b) => {
    const o = v * 3;
    P[o] = x; P[o + 1] = y; P[o + 2] = z; Nn[o] = nx; Nn[o + 1] = ny; Nn[o + 2] = nz; Cc[o] = r; Cc[o + 1] = g; Cc[o + 2] = b; v++;
  };
  const qi = () => { I[ii++] = v - 4; I[ii++] = v - 3; I[ii++] = v - 2; I[ii++] = v - 4; I[ii++] = v - 2; I[ii++] = v - 1; };
  const WE = PAL.wallEarth;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const h = hL(i, j), ci = (i + j * CW) * 3;
    const gx = (hL(i + 1, j) - hL(i - 1, j)) * 0.5, gz = (hL(i, j + 1) - hL(i, j - 1)) * 0.5;
    const lit = clamp(1 - (gx * SUNH.x + gz * SUNH.z) * 0.5, 0.8, 1.2) * shade[i + j * N];
    const r = col[ci] * lit, g = col[ci + 1] * lit, b = col[ci + 2] * lit;
    for (let c = 0; c < 4; c++) {
      const di = c >> 1, dj = (c === 1 || c === 2) ? 1 : 0, sx = di ? 1 : -1, sz = dj ? 1 : -1;
      const cnt = (hL(i + sx, j) > h ? 1 : 0) + (hL(i, j + sz) > h ? 1 : 0) + (hL(i + sx, j + sz) > h ? 1 : 0);
      const ao = 1 - 0.085 * cnt;
      pv(i + di, h, j + dj, 0, 1, 0, r * ao, g * ao, b * ao);
    }
    qi();
    for (let e = 0; e < 2; e++) {           // e = 0: edge toward +x, e = 1: edge toward +z
      const hb = e ? hL(i, j + 1) : hL(i + 1, j);
      if (hb === h) continue;
      const hi = Math.max(h, hb), lo = Math.min(h, hb);
      const k = h > hb ? ci : (e ? (i + (j + 1) * CW) * 3 : (i + 1 + j * CW) * 3);
      const tr = col[k] * 0.8, tg = col[k + 1] * 0.8, tb = col[k + 2] * 0.8;
      const deep = hi - lo > 0.5, jt = 0.9 + 0.2 * hash01(ox + i + e * 977, oz + j - e * 311);
      const br = deep ? WE[0] * jt : col[k] * 0.64, bg = deep ? WE[1] * jt : col[k + 1] * 0.64, bb = deep ? WE[2] * jt : col[k + 2] * 0.64;
      if (!e) {
        const x = i + 1;
        if (h > hb) { pv(x, lo, j, 1, 0, 0, br, bg, bb); pv(x, hi, j, 1, 0, 0, tr, tg, tb); pv(x, hi, j + 1, 1, 0, 0, tr, tg, tb); pv(x, lo, j + 1, 1, 0, 0, br, bg, bb); }
        else { pv(x, lo, j, -1, 0, 0, br, bg, bb); pv(x, lo, j + 1, -1, 0, 0, br, bg, bb); pv(x, hi, j + 1, -1, 0, 0, tr, tg, tb); pv(x, hi, j, -1, 0, 0, tr, tg, tb); }
      } else {
        const z = j + 1;
        if (h > hb) { pv(i, lo, z, 0, 0, 1, br, bg, bb); pv(i + 1, lo, z, 0, 0, 1, br, bg, bb); pv(i + 1, hi, z, 0, 0, 1, tr, tg, tb); pv(i, hi, z, 0, 0, 1, tr, tg, tb); }
        else { pv(i, lo, z, 0, 0, -1, br, bg, bb); pv(i, hi, z, 0, 0, -1, tr, tg, tb); pv(i + 1, hi, z, 0, 0, -1, tr, tg, tb); pv(i + 1, lo, z, 0, 0, -1, br, bg, bb); }
      }
      qi();
    }
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(P.slice(0, v * 3), 3));
  geo.setAttribute('normal', new T.BufferAttribute(Nn.slice(0, v * 3), 3));
  geo.setAttribute('color', new T.BufferAttribute(Cc.slice(0, v * 3), 3));
  geo.setIndex(new T.BufferAttribute(I.slice(0, ii), 1));
  geo.computeBoundingSphere();
  const mesh = new T.Mesh(geo, matTerrain);
  mesh.position.set(ox, 0, oz);
  mesh.matrixAutoUpdate = false; mesh.updateMatrix();
  mesh.receiveShadow = true;

  for (let k = 0; k < inst.length; k++) {
    const d = inst[k];
    if (d) inst[k] = { m: new Float32Array(d.m), c: new Float32Array(d.c), n: d.c.length / 3 };
  }
  return { cx: cx, cz: cz, mesh: mesh, inst: inst, colliders: new Float32Array(colliders) };
}

/* ============================================================
   8. CHUNK MANAGER — load ahead of the player, drop what falls behind
   ============================================================ */
const World = {
  chunks: new Map(), queue: [], sig: '', dirty: false, wait: 0, pcx: 0, pcz: 0,
  key: (cx, cz) => cx + ',' + cz,
  plan(px, pz, dx, dz) {
    const pcx = Math.floor(px / CH), pcz = Math.floor(pz / CH);
    const acx = Math.floor((px + dx * CH) / CH), acz = Math.floor((pz + dz * CH) / CH);
    const sig = pcx + ',' + pcz + ',' + acx + ',' + acz;
    if (sig === this.sig) return;
    this.sig = sig; this.pcx = pcx; this.pcz = pcz;
    for (const [k, ch] of this.chunks) {
      if (Math.max(Math.abs(ch.cx - pcx), Math.abs(ch.cz - pcz)) > CFG.keepR) {
        scene.remove(ch.mesh); ch.mesh.geometry.dispose(); this.chunks.delete(k); this.dirty = true;
      }
    }
    const want = new Map(), R = CFG.loadR;
    for (const c of [[pcx, pcz], [acx, acz]])
      for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
        const cx = c[0] + i, cz = c[1] + j, k = this.key(cx, cz);
        if (!this.chunks.has(k) && !want.has(k)) want.set(k, { k: k, cx: cx, cz: cz, d: (cx - pcx) * (cx - pcx) + (cz - pcz) * (cz - pcz) });
      }
    this.queue = Array.from(want.values()).sort((a, b) => a.d - b.d);
  },
  step() {                                   // at most one new chunk per frame
    while (this.queue.length) {
      const q = this.queue.shift();
      if (this.chunks.has(q.k) || Math.max(Math.abs(q.cx - this.pcx), Math.abs(q.cz - this.pcz)) > CFG.keepR) continue;
      const ch = makeChunk(q.cx, q.cz);
      this.chunks.set(q.k, ch); scene.add(ch.mesh); this.dirty = true;
      return true;
    }
    return false;
  },
  update(px, pz, dx, dz) {
    this.plan(px, pz, dx, dz);
    this.step();
    if (this.dirty && (this.queue.length === 0 || ++this.wait >= 8)) this.refill();
  },
  /* Copy every loaded chunk's instances into the shared pools, nearest chunks first. */
  refill() {
    this.dirty = false; this.wait = 0;
    const list = Array.from(this.chunks.values());
    const pcx = this.pcx, pcz = this.pcz;
    list.sort((a, b) => ((a.cx - pcx) * (a.cx - pcx) + (a.cz - pcz) * (a.cz - pcz)) - ((b.cx - pcx) * (b.cx - pcx) + (b.cz - pcz) * (b.cz - pcz)));
    for (let k = 0; k < pools.length; k++) {
      const m = pools[k], cap = m.userData.cap, ma = m.instanceMatrix.array, ca = m.instanceColor.array;
      let off = 0;
      for (let c = 0; c < list.length && off < cap; c++) {
        const d = list[c].inst[k];
        if (!d) continue;
        const n = Math.min(d.n, cap - off);
        ma.set(n === d.n ? d.m : d.m.subarray(0, n * 16), off * 16);
        ca.set(n === d.n ? d.c : d.c.subarray(0, n * 3), off * 3);
        off += n;
      }
      m.count = off;
      m.instanceMatrix.updateRange.offset = 0; m.instanceMatrix.updateRange.count = Math.max(16, off * 16);
      m.instanceColor.updateRange.offset = 0; m.instanceColor.updateRange.count = Math.max(3, off * 3);
      m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true;
    }
  },
  /* Push a circle out of trunks, bushes and boulders nearby. */
  collide(pos, pr) {
    const pcx = Math.floor(pos.x / CH), pcz = Math.floor(pos.z / CH);
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const ch = this.chunks.get(this.key(pcx + i, pcz + j));
      if (!ch) continue;
      const c = ch.colliders;
      for (let k = 0; k < c.length; k += 3) {
        const dx = pos.x - c[k], dz = pos.z - c[k + 1], rr = c[k + 2] + pr, d2 = dx * dx + dz * dz;
        if (d2 < rr * rr && d2 > 1e-8) { const d = Math.sqrt(d2), push = (rr - d) / d; pos.x += dx * push; pos.z += dz * push; }
      }
    }
  }
};

/* ============================================================
   9. PLAYER — model, movement, procedural animation
   ============================================================ */
const Player = {
  root: new T.Group(), pos: new T.Vector3(0.5, 0, 0.5), vel: new T.Vector3(), yaw: Math.PI * 0.75, speed: 0, ph: 0, scale: 1.12,
  build() {
    const rng = mulberry32(7);
    const C = { tunic: rgb(0xb5553c), tunicD: rgb(0x8f4230), scarf: rgb(0xe6d5a8), trouser: rgb(0x4a4034), boot: rgb(0x33291f),
                skin: rgb(0xe0b48e), hair: rgb(0x2e2520), belt: rgb(0x5c4630), eye: rgb(0x231c18) };
    const part = fn => { const g = new GeoB(rng); fn(g); const m = new T.Mesh(g.build(), matPlayer); m.castShadow = true; m.receiveShadow = true; return m; };
    const B = (g, x, y, z, w, h, d, c, o) => g.box(Object.assign({ x: x, y: y, z: z, w: w, h: h, d: d, c: c, shade: 0.82, fj: 0.04 }, o || {}));

    const body = this.body = new T.Group(); body.position.y = 0.8; this.root.add(body);
    const torso = this.torso = new T.Group(); body.add(torso);
    torso.add(part(g => {
      B(g, 0, 0.04, 0, 0.47, 0.17, 0.31, C.tunicD, { taper: 0.9 });
      B(g, 0, 0.3, 0, 0.4, 0.42, 0.25, C.tunic, { taper: 1.1, c2: mul(C.tunic, 1.08) });
      B(g, 0, 0.13, 0, 0.44, 0.06, 0.29, C.belt);
      B(g, 0, 0.545, 0, 0.36, 0.11, 0.31, C.scarf, { ry: 0.1 });
      B(g, -0.09, 0.42, -0.165, 0.11, 0.24, 0.05, mul(C.scarf, 0.92), { rz: 0.12 });
    }));
    const head = this.head = new T.Group(); head.position.y = 0.58; torso.add(head);
    head.add(part(g => {
      B(g, 0, 0.2, 0, 0.38, 0.36, 0.36, C.skin, { taper: 0.95, shade: 0.9 });
      B(g, 0, 0.39, -0.01, 0.43, 0.13, 0.41, C.hair, { taper: 0.9, c2: mul(C.hair, 1.5) });
      B(g, 0, 0.22, -0.17, 0.42, 0.34, 0.1, C.hair);
      B(g, 0.2, 0.27, -0.04, 0.05, 0.24, 0.3, C.hair);
      B(g, -0.2, 0.27, -0.04, 0.05, 0.24, 0.3, C.hair);
      B(g, 0.03, 0.335, 0.185, 0.4, 0.1, 0.05, C.hair, { rz: 0.08 });
      B(g, 0.085, 0.2, 0.182, 0.05, 0.07, 0.012, C.eye, { fj: 0 });
      B(g, -0.085, 0.2, 0.182, 0.05, 0.07, 0.012, C.eye, { fj: 0 });
    }));
    const arm = side => {
      const sh = new T.Group(); sh.position.set(0.285 * side, 0.47, 0); torso.add(sh);
      sh.add(part(g => B(g, 0, -0.125, 0, 0.135, 0.28, 0.15, C.tunic, { taper: 1.08 })));
      const el = new T.Group(); el.position.y = -0.25; sh.add(el);
      el.add(part(g => { B(g, 0, -0.1, 0, 0.11, 0.21, 0.12, C.skin); B(g, 0, -0.235, 0.005, 0.12, 0.09, 0.13, mul(C.skin, 0.93)); }));
      return [sh, el];
    };
    const leg = side => {
      const hip = new T.Group(); hip.position.set(0.115 * side, 0, 0); body.add(hip);
      hip.add(part(g => B(g, 0, -0.19, 0, 0.175, 0.4, 0.195, C.trouser)));
      const kn = new T.Group(); kn.position.y = -0.38; hip.add(kn);
      kn.add(part(g => { B(g, 0, -0.15, 0, 0.15, 0.3, 0.17, mul(C.trouser, 0.94)); B(g, 0, -0.345, 0.04, 0.18, 0.13, 0.28, C.boot, { c2: mul(C.boot, 1.3) }); }));
      return [hip, kn];
    };
    [this.armL, this.elbowL] = arm(1); [this.armR, this.elbowR] = arm(-1);
    [this.legL, this.kneeL] = leg(1); [this.legR, this.kneeR] = leg(-1);
    this.root.scale.setScalar(this.scale);
    scene.add(this.root);

    /* Soft contact shadow under the feet. */
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const cx = cv.getContext('2d'), gr = cx.createRadialGradient(32, 32, 2, 32, 32, 31);
    gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.6, 'rgba(0,0,0,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);
    const blob = this.blob = new T.Mesh(new T.PlaneGeometry(1.25, 1.25),
      new T.MeshBasicMaterial({ map: new T.CanvasTexture(cv), transparent: true, depthWrite: false, color: 0x1a1f12, opacity: 0.7, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    blob.rotation.x = -Math.PI / 2; blob.renderOrder = 1;
    scene.add(blob);
  },
  place(x, z) { this.pos.set(x, Fields.ground(x, z), z); this.vel.set(0, 0, 0); },
  update(dt, dirX, dirZ, mag, time) {
    const target = mag <= 0 ? 0 : (mag < 0.5 ? CFG.walk * (mag / 0.5) : CFG.walk + (CFG.run - CFG.walk) * ((mag - 0.5) / 0.5));
    const rate = target > 0 ? 9 : 11;
    this.vel.x = damp(this.vel.x, dirX * target, rate, dt);
    this.vel.z = damp(this.vel.z, dirZ * target, rate, dt);
    this.pos.x += this.vel.x * dt; this.pos.z += this.vel.z * dt;
    World.collide(this.pos, 0.3);
    this.pos.y = damp(this.pos.y, Fields.ground(this.pos.x, this.pos.z), 16, dt);
    this.speed = Math.hypot(this.vel.x, this.vel.z);
    if (this.speed > 0.2) {
      let d = Math.atan2(this.vel.x, this.vel.z) - this.yaw;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      this.yaw += d * (1 - Math.exp(-12 * dt));
    }
    this.root.position.copy(this.pos);
    this.root.rotation.y = this.yaw;
    this.blob.position.set(this.pos.x, this.pos.y + 0.04, this.pos.z);
    this.animate(dt, time);
  },
  animate(dt, t) {
    const sp = this.speed, mv = sm(0.05, 1.2, sp), run = sm(3.2, 6.2, sp), idle = 1 - mv;
    this.ph += sp * dt * TAU / (lerp(1.9, 3.5, run) * this.scale);    // phase follows distance, so feet do not skate
    const s = Math.sin(this.ph), c = Math.cos(this.ph), br = Math.sin(t * 1.9);
    const A = lerp(0.5, 0.95, run) * mv, K = lerp(0.6, 1.5, run) * mv, B = lerp(0.42, 1.0, run) * mv;
    this.legL.rotation.x = -s * A; this.legR.rotation.x = s * A;
    this.kneeL.rotation.x = K * Math.max(0, c) + 0.04; this.kneeR.rotation.x = K * Math.max(0, -c) + 0.04;
    this.armL.rotation.x = s * B; this.armR.rotation.x = -s * B;
    this.armL.rotation.z = 0.09 + idle * 0.02 * br; this.armR.rotation.z = -0.09 - idle * 0.02 * br;
    const eb = -(0.12 + 0.25 * mv + 1.05 * run);
    this.elbowL.rotation.x = eb - Math.max(0, s) * 0.25 * mv; this.elbowR.rotation.x = eb - Math.max(0, -s) * 0.25 * mv;
    this.body.position.y = 0.8 - mv * (0.025 + 0.05 * run) * (0.5 + 0.5 * Math.cos(2 * this.ph)) + idle * 0.008 * br;
    this.body.rotation.x = mv * (0.05 + 0.2 * run);
    this.torso.rotation.y = -s * 0.14 * mv; this.torso.rotation.z = c * 0.03 * mv;
    this.torso.scale.y = 1 + idle * 0.014 * br;
    this.head.rotation.y = idle * 0.22 * Math.sin(t * 0.45) + s * 0.07 * mv;
    this.head.rotation.x = -run * 0.12 + idle * 0.03 * Math.sin(t * 0.8);
  }
};

/* ============================================================
   10. CAMERA RIG — fixed heading, high angle, smooth follow, pinch zoom
   ============================================================ */
const Rig = {
  dist: CFG.zoom, want: CFG.zoom, ct: new T.Vector3(), focus: new T.Vector3(), portrait: false, w: 1, h: 1,
  snap() { this.ct.copy(Player.pos); this.dist = this.want; },
  resize() {
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    this.w = w; this.h = h; this.portrait = h > w;
    renderer.setPixelRatio(Perf.pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    /* Keep the horizontal view near 34 degrees, so portrait screens gain height instead of losing width. */
    camera.fov = clamp(2 * Math.atan(Math.tan(17 * Math.PI / 180) / camera.aspect) * 180 / Math.PI, 34, 58);
    camera.updateProjectionMatrix();
  },
  update(dt) {
    this.dist = damp(this.dist, this.want, 9, dt);
    const d = this.dist * (this.portrait ? 1.1 : 1);
    const p = Player.pos, v = Player.vel;
    this.ct.x = damp(this.ct.x, p.x + v.x * 0.3, 6, dt);
    this.ct.z = damp(this.ct.z, p.z + v.z * 0.3, 6, dt);
    this.ct.y = damp(this.ct.y, p.y, 3, dt);
    const pitch = lerp(0.86, 0.96, sm(CFG.zoomMin, CFG.zoomMax, this.dist));   // closer in, the view drops a little
    const ch = Math.cos(pitch) * d, cv = Math.sin(pitch) * d;
    this.focus.copy(this.ct).addScaledVector(FWD, d * 0.1); this.focus.y += 0.9;
    camera.position.set(this.focus.x - FWD.x * ch, this.focus.y + cv, this.focus.z - FWD.z * ch);
    camera.lookAt(this.focus);
    scene.fog.near = d * 0.95; scene.fog.far = d * 4.6;
    return d;
  }
};

/* ============================================================
   11. INPUT — drag anywhere to walk, two fingers to zoom, nothing drawn on screen
   ============================================================ */
const Input = {
  pts: new Map(), moveId: null, ax: 0, ay: 0, mx: 0, my: 0, pinch0: 0, zoom0: 0, keys: new Set(),
  init(el) {
    const opt = { passive: false };
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
      this.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pts.size === 1) { this.moveId = e.pointerId; this.ax = e.clientX; this.ay = e.clientY; this.mx = this.my = 0; }
      else if (this.pts.size === 2) { this.moveId = null; this.mx = this.my = 0; this.pinch0 = this.spread(); this.zoom0 = Rig.want; }
    }, opt);
    el.addEventListener('pointermove', e => {
      const p = this.pts.get(e.pointerId);
      if (!p) return;
      e.preventDefault();
      p.x = e.clientX; p.y = e.clientY;
      if (this.pts.size >= 2) {
        const d = this.spread();
        if (this.pinch0 > 8 && d > 8) Rig.want = clamp(this.zoom0 * this.pinch0 / d, CFG.zoomMin, CFG.zoomMax);
      } else if (e.pointerId === this.moveId) {
        const R = clamp(Math.min(Rig.w, Rig.h) * 0.17, 56, 120);
        let dx = p.x - this.ax, dy = p.y - this.ay, len = Math.hypot(dx, dy);
        if (len > R) {                      // the anchor trails the finger, so reversing direction is instant
          this.ax += dx * (1 - R / len); this.ay += dy * (1 - R / len);
          dx = p.x - this.ax; dy = p.y - this.ay; len = R;
        }
        const dead = 0.1, m = len / R;
        if (m < dead) { this.mx = this.my = 0; }
        else { const k = ((m - dead) / (1 - dead)) / len; this.mx = dx * k; this.my = dy * k; }
      }
    }, opt);
    const up = e => {
      if (!this.pts.delete(e.pointerId)) return;
      if (e.pointerId === this.moveId) { this.moveId = null; this.mx = this.my = 0; }
      if (this.pts.size === 1) {            // pinch ended: the finger left down starts a fresh drag from where it is
        const [id, p] = this.pts.entries().next().value;
        this.moveId = id; this.ax = p.x; this.ay = p.y; this.mx = this.my = 0;
      } else if (this.pts.size >= 2) { this.pinch0 = this.spread(); this.zoom0 = Rig.want; }
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    el.addEventListener('wheel', e => { e.preventDefault(); Rig.want = clamp(Rig.want * Math.exp(e.deltaY * 0.0012), CFG.zoomMin, CFG.zoomMax); }, opt);
    for (const ev of ['touchstart', 'touchmove', 'gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart'])
      el.addEventListener(ev, e => e.preventDefault(), opt);
    window.addEventListener('keydown', e => { if (KEYMAP[e.code]) { this.keys.add(e.code); e.preventDefault(); } });
    window.addEventListener('keyup', e => this.keys.delete(e.code));
    window.addEventListener('blur', () => { this.keys.clear(); this.pts.clear(); this.moveId = null; this.mx = this.my = 0; });
  },
  spread() { const it = this.pts.values(), a = it.next().value, b = it.next().value; return Math.hypot(a.x - b.x, a.y - b.y); },
  /* Screen-space intent (x right, y down), length 0..1. */
  read(out) {
    let x = this.mx, y = this.my;
    if (!x && !y && this.keys.size) {
      for (const k of this.keys) { const m = KEYMAP[k]; if (m && m.length) { x += m[0]; y += m[1]; } }
      const l = Math.hypot(x, y);
      if (l > 0) { const m = (this.keys.has('ShiftLeft') || this.keys.has('ShiftRight')) ? 1 : 0.5; x = x / l * m; y = y / l * m; }
    }
    out.x = x; out.y = y;
  }
};
const KEYMAP = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0], ShiftLeft: [], ShiftRight: [] };

/* ============================================================
   12. PERFORMANCE — drop render resolution if the device cannot hold the frame rate
   ============================================================ */
const Perf = {
  pr: Math.min(window.devicePixelRatio || 1, 2), acc: 0, n: 0, warm: 3,
  tick(dt) {
    if (this.warm > 0) { this.warm -= dt; return; }
    this.acc += dt; this.n++;
    if (this.acc < 2) return;
    const avg = this.acc / this.n; this.acc = 0; this.n = 0;
    if (avg > 0.027 && this.pr > 0.85) { this.pr = Math.max(0.85, this.pr - 0.25); Rig.resize(); this.warm = 1; }
  }
};

/* ============================================================
   13. BOOT + LOOP
   ============================================================ */
const _in = { x: 0, y: 0 }, _p = new T.Vector3(), _buf = new T.Vector2();
let last = 0, time = 0;

function lightFollow(d) {
  const ext = Math.ceil(d * 1.65 / 8) * 8;
  const cam = sun.shadow.camera;
  if (ext !== shadowExt) { shadowExt = ext; cam.left = -ext; cam.right = ext; cam.top = ext; cam.bottom = -ext; cam.updateProjectionMatrix(); }
  const texel = 2 * ext / SHADOW_RES;
  _p.copy(Rig.focus).addScaledVector(FWD, d * 0.32);
  const a = Math.round(_p.dot(L_X) / texel) * texel, b = Math.round(_p.dot(L_Y) / texel) * texel, c = _p.dot(SUN);
  _p.set(0, 0, 0).addScaledVector(L_X, a).addScaledVector(L_Y, b).addScaledVector(SUN, c);
  sun.target.position.copy(_p);
  sun.position.copy(_p).addScaledVector(SUN, 120);
  sun.target.updateMatrixWorld();
}

function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000) || 0.016);
  last = ms; time += dt;

  Input.read(_in);
  const mag = Math.min(1, Math.hypot(_in.x, _in.y));
  let dx = 0, dz = 0;
  if (mag > 0) {                              // screen drag -> ground direction relative to the camera
    dx = (RIGHT.x * _in.x - FWD.x * _in.y) / mag; dz = (RIGHT.z * _in.x - FWD.z * _in.y) / mag;
  }
  Player.update(dt, dx, dz, mag, time);

  const sp = Player.speed;
  World.update(Player.pos.x, Player.pos.z, sp > 0.5 ? Player.vel.x / sp : 0, sp > 0.5 ? Player.vel.z / sp : 0);

  const d = Rig.update(dt);
  lightFollow(d);

  /* Where the player sits on screen, for the see-through window in tree canopies. */
  camera.updateMatrixWorld();
  _p.set(Player.pos.x, Player.pos.y + 0.95, Player.pos.z);
  const depth = -_p.clone().applyMatrix4(camera.matrixWorldInverse).z;
  _p.project(camera);
  renderer.getDrawingBufferSize(_buf);
  U.uObs.value.set((_p.x * 0.5 + 0.5) * _buf.x, (_p.y * 0.5 + 0.5) * _buf.y, depth,
                   1.7 / (depth * Math.tan(camera.fov * Math.PI / 360)) * _buf.y * 0.5);
  U.uTime.value = time;

  renderer.render(scene, camera);
  Perf.tick(dt);
}

function start(saved) {
  Player.build();
  const sx = saved && isFinite(saved.x) ? saved.x : 0.5, sz = saved && isFinite(saved.z) ? saved.z : 0.5;
  if (saved && isFinite(saved.zoom)) Rig.want = clamp(saved.zoom, CFG.zoomMin, CFG.zoomMax);
  Player.place(sx, sz);
  World.plan(sx, sz, 0, 0);
  while (World.step()) { /* build the first ring of chunks before the first frame */ }
  World.refill();
  Rig.resize(); Rig.snap();
  Input.init(stage);
  window.addEventListener('resize', () => Rig.resize());
  window.addEventListener('orientationchange', () => setTimeout(() => Rig.resize(), 60));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => Rig.resize());
  if (window.ResizeObserver) new ResizeObserver(() => Rig.resize()).observe(stage);
  requestAnimationFrame(t => { last = t; frame(t); });
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ x: Player.pos.x, z: Player.pos.z, zoom: Rig.want }));
try {
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
} catch (err) {
  console.error(err);
  failNote.hidden = false;
}
})();
</script>
